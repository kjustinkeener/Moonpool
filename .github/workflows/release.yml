# Release + auto-update workflow
#
# Triggers on a version tag (e.g. v0.1.0) and builds Moonpool for Windows, macOS, and Linux,
# then publishes a DRAFT GitHub Release containing the per-OS bundles. On Windows it also
# publishes the CUSTOM updater artifacts that Moonpool's in-app self-updater reads:
#   - moonpool.exe   the raw, self-installing/self-updating executable (the download)
#   - update.json    { version, notes, url, signature }
# The signature is a minisign signature verified in-app against the committed public
# key (src-tauri/src/update.rs). The help site is embedded in the exe, so it updates
# only with the app. This replaces tauri-plugin-updater +
# latest.json; the NSIS/MSI bundles are still built but are no longer the update path.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           - the minisign/Tauri signing private key
#                                         (generate with `npm run tauri signer generate`).
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  - the password protecting that private key
#                                         (set to an empty string if the key has no password).
#
# To cut a release: bump the version in package.json and src-tauri/tauri.conf.json, commit,
# then push a matching tag, for example:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The release is created as a DRAFT; review the artifacts and publish it manually.

name: Release

on:
  push:
    tags:
      - "v*"

# Allow the workflow to create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both architecture targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Build the Starlight help site into help/dist BEFORE the Tauri build: the Rust
      # crate embeds that folder with include_dir!, so it must exist on every platform.
      - name: Build help site
        run: |
          npm --prefix help ci
          npm --prefix help run build


      # Fail fast if the tag and the three version sources disagree: a mismatched
      # release ships an exe stamped with one version while update.json advertises
      # another, so clients either never see the update or reject it. node is already
      # on PATH from setup-node, so this runs the same on every matrix platform.
      - name: Preflight version consistency
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(node -e "const s=require('fs').readFileSync('src-tauri/Cargo.toml','utf8');const sec=s.split(/^\[package\]/m)[1]||'';const m=sec.match(/^\s*version\s*=\s*\"([^\"]+)\"/m);process.stdout.write(m?m[1]:'')")
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          fail=0
          for pair in "package.json:$pkg" "tauri.conf.json:$conf" "Cargo.toml:$cargo"; do
            name="${pair%%:*}"; v="${pair#*:}"
            if [ "$v" != "$tag" ]; then echo "::error::$name version '$v' does not match tag '$tag'"; fail=1; fi
          done
          [ "$fail" = 0 ]

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Moonpool ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # AppImages are self-contained and can safely replace their own source file.
      # Package-manager installs (.deb/.rpm) intentionally keep using apt/dnf/rpm
      # for upgrades. Publish a Linux-specific manifest so the app never mistakes
      # the Windows raw-exe updater payload for a Linux update.
      - name: Publish Linux AppImage updater artifacts
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          image=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          if [ -z "$image" ]; then echo "AppImage not found" >&2; exit 1; fi
          npx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$image"
          signature=$(base64 --decode "$image.sig")
          version="${GITHUB_REF_NAME#v}"
          filename=$(basename "$image")
          url="https://github.com/kjustinkeener/Moonpool/releases/download/${GITHUB_REF_NAME}/${filename}"
          node -e 'const fs=require("fs"); const a=process.argv; fs.writeFileSync("linux-update.json", JSON.stringify({version:a[1],notes:"",url:a[2],signature:a[3]}))' "$version" "$url" "$signature"
          gh release upload "$GITHUB_REF_NAME" "$image" linux-update.json --clobber

      # Publish the custom self-updater artifacts (Windows only): the raw exe plus a
      # minisign-signed update.json that the in-app updater reads from Releases/latest.
      - name: Publish custom updater artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Pass empty-string args (the key has no password) through to native exes
          # verbatim instead of dropping them, so <FILE> isn't swallowed by --password.
          $PSNativeCommandArgumentPassing = 'Standard'
          $exe = "src-tauri/target/release/moonpool.exe"
          if (-not (Test-Path $exe)) { throw "raw exe not found at $exe" }

          # The built exe must carry the tagged version before we advertise it in
          # update.json (the preflight already checked the sources; this catches a
          # stale/cached build). ProductVersion is 4-part (x.y.z.0); compare x.y.z.
          $tagVer = "${{ github.ref_name }}".TrimStart("v")
          $exeVer = (Get-Item $exe).VersionInfo.ProductVersion
          if ($exeVer) {
            $exeXYZ = ($exeVer.TrimStart("v").Split(".")[0..2] -join ".")
            if ($exeXYZ -ne $tagVer) { throw "built exe version '$exeVer' does not match tag '$tagVer'" }
          }

          # Sign the raw exe with Tauri's signer (minisign-compatible). This writes
          # "$exe.sig", whose content is base64 of the full minisign (.minisig) text.
          npx tauri signer sign --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" $exe

          $sigB64 = (Get-Content "$exe.sig" -Raw).Trim()
          $minisig = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($sigB64))

          $version = "${{ github.ref_name }}".TrimStart("v")
          $url = "https://github.com/kjustinkeener/Moonpool/releases/download/${{ github.ref_name }}/moonpool.exe"

          $manifest = [ordered]@{
            version   = $version
            notes     = ""
            url       = $url
            signature = $minisig
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path update.json -Encoding utf8

          gh release upload ${{ github.ref_name }} $exe update.json --clobber
