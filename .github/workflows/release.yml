# Release + auto-update workflow
#
# Triggers on a version tag (e.g. v0.1.0) and builds Moonpool for Windows, macOS, and Linux,
# then publishes a DRAFT GitHub Release containing the per-OS installers plus the updater
# artifacts (the signatures and `latest.json` that the in-app updater reads).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           - the minisign/Tauri updater private key
#                                         (generate with `npm run tauri signer generate`).
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  - the password protecting that private key
#                                         (set to an empty string if the key has no password).
#
# Prerequisites (already configured, verify before the first release):
#   - src-tauri/tauri.conf.json has `bundle.createUpdaterArtifacts: true` so the signed
#     updater artifacts and `latest.json` are emitted. (Already true in this repo.)
#   - The updater plugin's `pubkey` in tauri.conf.json matches TAURI_SIGNING_PRIVATE_KEY,
#     and its `endpoints` point at this repo's Releases `latest.json`.
#
# To cut a release: bump the version in package.json and src-tauri/tauri.conf.json, commit,
# then push a matching tag, for example:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The release is created as a DRAFT; review the artifacts and publish it manually.

name: Release

on:
  push:
    tags:
      - "v*"

# Allow the workflow to create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both architecture targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Moonpool ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
