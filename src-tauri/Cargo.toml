[package]
name = "moonpool"
version = "0.3.13"
description = "A system-tray launcher hub for local apps and dev servers, with an embedded terminal per app."
authors = ["Justin Keener"]
license = "MIT"
edition = "2021"
repository = "https://github.com/kjustinkeener/Moonpool"
homepage = "https://fasterdb.com/software/moonpool/"
keywords = ["tauri", "launcher", "tray", "dev-tools", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[lib]
# The desktop entry point lives in lib.rs::run(); main.rs is a thin shim.
name = "moonpool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
sysinfo = "=0.30.13"
base64 = "0.22"
# Embed the example dashboards in the binary; written out to the bundle on first run.
include_dir = "0.7"
# Custom installer/updater: tiny blocking HTTP, minisign verify, semver compare.
ureq = "2"
minisign-verify = "0.2"
semver = "1"
# Extract the downloaded help-docs bundle (a ZIP) in update::help_apply.
zip = "2"
# Agent control surface (control_pipe.rs): tokio is otherwise only transitive through Tauri;
# the Windows named-pipe async API needs it named explicitly. Mirrors FasterDB's control.rs.
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
# Job Objects for reliable whole-tree process ownership: a launched app's deep
# subtree (cmd -> npm/uv -> node/python -> model server/docker/workers) is assigned
# to a job at spawn, so Stop kills every descendant by membership - immune to the
# PID recycling and re-parenting that make a snapshot `taskkill /T` miss grandchildren.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# Window-content capture for the pipe `screenshot` verb (control_pipe.rs / screenshot.rs).
# Matches the `windows` crate version Tauri itself resolves to (see Cargo.lock) so we reuse
# its HWND type (WebviewWindow::hwnd()) instead of pulling in a second, incompatible one.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

# line-tables-only keeps panic backtraces/line numbers but avoids the multi-GB PDBs
# that full debug info generates over repeated incremental builds.
[profile.dev]
debug = "line-tables-only"

[profile.release]
# Smaller, faster release binaries. panic = "abort" is intentionally omitted so
# the updater/tauri build stays on the default unwinding path.
codegen-units = 1
lto = true
strip = true
