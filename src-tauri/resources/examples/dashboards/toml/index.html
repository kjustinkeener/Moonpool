<script>
  function parseTOML(text) { return MP.toRecords(TOML.parse(text, { bigint: false })); }
  function raw(id) { return document.getElementById(id).textContent.trim(); }
  function baked(id) { return parseTOML(raw(id)); }

  MP.createExplorer(document.getElementById("app"), {
    id: "toml",
    formatName: "TOML",
    title: "TOML Explorer",
    subtitle: "Drop any TOML file (arrays of tables, a table of tables, or inline sub-tables) and get an instant, auto-profiled dashboard. Nested tables are flattened automatically. One analyzer, any shape.",
    accept: ".toml,.txt",
    parseFile: function (file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () {
          try { resolve(MP.toRecords(TOML.parse(String(r.result), { bigint: false }))); }
          catch (e) { reject(e); }
        };
        r.onerror = function () { reject(r.error); };
        r.readAsText(file);
      });
    },
    tabs: [
      { name: "Spend vs revenue", rows: baked("s-campaign"), raw: raw("s-campaign"), file: "campaigns.toml",
        mapping: { x: "spend", y: ["revenue"], group: "channel", chart: "scatter" } },
      { name: "Revenue by product", rows: baked("s-array"), raw: raw("s-array"), file: "products.toml",
        mapping: { x: "name", y: ["revenue"], group: "", chart: "pie" } },
      { name: "Plans by tier", rows: baked("s-map"), raw: raw("s-map"), file: "plans.toml",
        mapping: { x: "key", y: ["mrr"], group: "", chart: "bar" } },
      { name: "Warehouse throughput", rows: baked("s-deep"), raw: raw("s-deep"), file: "warehouses.toml",
        mapping: { x: "name", y: ["throughput.inbound", "throughput.outbound"], group: "", chart: "bar" } }
    ]
  });
</script>
