<script>
  function parseCSV(text) {
    var out = Papa.parse(text.trim(), { header: true, skipEmptyLines: true, dynamicTyping: false });
    return out.data;
  }
  function raw(id) { return document.getElementById(id).textContent.trim(); }
  function baked(id) { return parseCSV(raw(id)); }

  MP.createExplorer(document.getElementById("app"), {
    id: "csv",
    formatName: "CSV / TSV",
    title: "CSV Explorer",
    subtitle: "Drop any CSV or TSV file and get an instant, auto-profiled dashboard – or explore the differently-shaped sample tabs below. One analyzer, any shape.",
    accept: ".csv,.tsv,.txt",
    parseFile: function (file) {
      return new Promise(function (resolve, reject) {
        Papa.parse(file, {
          header: true, skipEmptyLines: true, dynamicTyping: false,
          complete: function (res) { resolve(res.data); },
          error: function (err) { reject(err); }
        });
      });
    },
    tabs: [
      { name: "Traffic sources", rows: baked("s-cat"), raw: raw("s-cat"), file: "traffic-sources.csv",
        mapping: { x: "source", y: ["sessions"], group: "", chart: "pie" } },
      { name: "Revenue by region", rows: baked("s-wide"), raw: raw("s-wide"), file: "revenue-by-region.csv",
        mapping: { x: "month", y: ["North America", "EMEA", "APAC", "LATAM"], group: "", chart: "line" } },
      { name: "Signups by channel", rows: baked("s-long"), raw: raw("s-long"), file: "signups-by-channel.csv",
        mapping: { x: "date", y: ["signups"], group: "channel", chart: "area" } },
      { name: "Spend vs revenue", rows: baked("s-scatter"), raw: raw("s-scatter"), file: "spend-vs-revenue.csv",
        mapping: { x: "spend", y: ["revenue"], group: "channel", chart: "scatter" } }
    ]
  });
</script>
