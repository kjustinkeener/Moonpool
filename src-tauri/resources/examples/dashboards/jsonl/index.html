<script>
  function parseJSONL(text) {
    var rows = [];
    text.split(/\r?\n/).forEach(function (line) {
      var s = line.trim();
      if (!s) return;
      rows.push(JSON.parse(s));
    });
    return MP.toRecords(rows);
  }
  function raw(id) { return document.getElementById(id).textContent.trim(); }
  function baked(id) { return parseJSONL(raw(id)); }

  MP.createExplorer(document.getElementById("app"), {
    id: "jsonl",
    formatName: "JSONL / NDJSON",
    title: "JSONL Explorer",
    subtitle: "Drop a newline-delimited JSON file (one record per line, shapes may vary line to line) and get an instant, auto-profiled dashboard. One analyzer, any shape.",
    accept: ".jsonl,.ndjson,.json,.txt",
    parseFile: function (file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () {
          try { resolve(parseJSONL(String(r.result))); }
          catch (e) { reject(e); }
        };
        r.onerror = function () { reject(r.error); };
        r.readAsText(file);
      });
    },
    tabs: [
      { name: "Daily active users", rows: baked("s-dau"), raw: raw("s-dau"), file: "daily-active-users.jsonl",
        mapping: { x: "date", y: ["dau", "sessions"], group: "", chart: "area" } },
      { name: "Ad spend by platform", rows: baked("s-spend"), raw: raw("s-spend"), file: "ad-spend.jsonl",
        mapping: { x: "platform", y: ["spend"], group: "", chart: "pie" } },
      { name: "Event stream", rows: baked("s-events"), raw: raw("s-events"), file: "event-stream.jsonl",
        mapping: { x: "event", y: [], group: "", chart: "bar" } },
      { name: "Deploys", rows: baked("s-deploys"), raw: raw("s-deploys"), file: "deploys.jsonl",
        mapping: { x: "service", y: ["deploy.duration_s"], group: "deploy.status", chart: "bar" } }
    ]
  });
</script>
