  real .xlsx worksheet at load, so the demo genuinely exercises SheetJS on every
  baked tab and not just on your own file. Each is a DIFFERENTLY shaped sheet
  (analyzer torture test). A binary .xlsx has no meaningful "raw text", so the
  code pane shows a sheet SUMMARY (dimensions, columns, a few rows) instead.
-->

<script>
  // Author baked data as CSV, but round-trip it through a real .xlsx worksheet
  // so SheetJS parses every tab exactly as it would a dropped Excel file.
  function csvToSheet(csv) {
    var wb = XLSX.read(csv, { type: "string" });          // CSV -> workbook
    var ws = wb.Sheets[wb.SheetNames[0]];
    return { ws: ws, name: "Sheet1" };
  }
  function sheetToRows(ws) {
    return MP.toRecords(XLSX.utils.sheet_to_json(ws, { defval: null }));
  }
  // A short, human-readable summary of a worksheet for the code pane (binary
  // .xlsx has no useful raw text, so we describe the sheet instead of dumping bytes).
  function sheetSummary(name, ws, rows) {
    var ref = ws["!ref"] || "A1";
    var range = XLSX.utils.decode_range(ref);
    var nCols = range.e.c - range.s.c + 1;
    var nRows = range.e.r - range.s.r + 1;
    var cols = rows.length ? Object.keys(rows[0]) : [];
    var lines = [];
    lines.push("Sheet:      " + name);
    lines.push("Range:      " + ref + "  (" + nRows + " rows x " + nCols + " cols)");
    lines.push("Data rows:  " + rows.length);
    lines.push("Columns:    " + cols.join(", "));
    lines.push("");
    lines.push("First rows (as parsed):");
    rows.slice(0, 6).forEach(function (r) {
      lines.push("  " + cols.map(function (c) { return r[c]; }).join("  |  "));
    });
    if (rows.length > 6) lines.push("  ... (" + (rows.length - 6) + " more rows)");
    return lines.join("\n");
  }
  function raw(id) { return document.getElementById(id).textContent.trim(); }
  // Build one baked tab from a CSV script element.
  function baked(id, sheetName) {
    var s = csvToSheet(raw(id));
    var rows = sheetToRows(s.ws);
    return { rows: rows, raw: sheetSummary(sheetName || s.name, s.ws, rows) };
  }
  var wide = baked("s-wide", "Revenue"),
      long = baked("s-long", "Signups"),
      cat  = baked("s-cat",  "Departments"),
      fin  = baked("s-fin",  "Financials");

  MP.createExplorer(document.getElementById("app"), {
    id: "xlsx",
    formatName: "Excel",
    title: "Excel Explorer",
    subtitle: "Drop any .xlsx or .xls workbook and get an instant, auto-profiled dashboard from its first sheet – or explore the differently-shaped sample tabs below. One analyzer, any shape.",
    accept: ".xlsx,.xls,.xlsm,.xlsb,.ods",
    parseFile: function (file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () {
          try {
            var wb = XLSX.read(r.result, { type: "array", cellDates: true });
            var name = wb.SheetNames[0];
            var ws = wb.Sheets[name];
            var rows = sheetToRows(ws);
            if (!rows.length) throw new Error("first sheet has no rows");
            resolve({ rows: rows, raw: sheetSummary(name, ws, rows) });
          } catch (e) { reject(e); }
        };
        r.onerror = function () { reject(r.error); };
        r.readAsArrayBuffer(file);          // binary: read as ArrayBuffer, not text
      });
    },
    tabs: [
      { name: "Revenue by region", rows: wide.rows, raw: wide.raw, file: "revenue-by-region.xlsx",
        mapping: { x: "Month", y: ["North America", "EMEA", "APAC", "LATAM"], group: "", chart: "line" } },
      { name: "Signups by channel", rows: long.rows, raw: long.raw, file: "signups-by-channel.xlsx",
        mapping: { x: "Date", y: ["Signups"], group: "Channel", chart: "area" } },
      { name: "Departments", rows: cat.rows, raw: cat.raw, file: "departments.xlsx",
        mapping: { x: "Department", y: ["Headcount"], group: "", chart: "bar" } },
      { name: "P&L by quarter", rows: fin.rows, raw: fin.raw, file: "pnl-by-quarter.xlsx",
        mapping: { x: "Line item", y: ["Amount"], group: "Quarter", chart: "bar" } }
    ]
  });
</script>
