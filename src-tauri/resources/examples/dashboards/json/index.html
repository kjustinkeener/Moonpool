<script>
  function parseJSON(text) { return MP.toRecords(JSON.parse(text)); }
  function raw(id) { return document.getElementById(id).textContent.trim(); }
  function baked(id) { return parseJSON(raw(id)); }

  MP.createExplorer(document.getElementById("app"), {
    id: "json",
    formatName: "JSON",
    title: "JSON Explorer",
    subtitle: "Drop any JSON file (array of records, a nested object, or a map) and get an instant, auto-profiled dashboard. Nested objects are flattened automatically. One analyzer, any shape.",
    accept: ".json,.txt",
    parseFile: function (file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () {
          try { resolve(MP.toRecords(JSON.parse(String(r.result)))); }
          catch (e) { reject(e); }
        };
        r.onerror = function () { reject(r.error); };
        r.readAsText(file);
      });
    },
    tabs: [
      { name: "Monthly MRR", rows: baked("s-flat"), raw: raw("s-flat"), file: "monthly-mrr.json",
        mapping: { x: "month", y: ["mrr", "expansion"], group: "", chart: "line" } },
      { name: "Revenue by channel", rows: baked("s-map"), raw: raw("s-map"), file: "revenue-by-channel.json",
        mapping: { x: "key", y: ["revenue"], group: "", chart: "pie" } },
      { name: "Acquisition funnel", rows: baked("s-nested"), raw: raw("s-nested"), file: "acquisition-funnel.json",
        mapping: { x: "stage", y: ["users"], group: "", chart: "bar" } },
      { name: "Cohort retention", rows: baked("s-deep"), raw: raw("s-deep"), file: "cohort-retention.json",
        mapping: { x: "cohort", y: ["retention.d1", "retention.d7", "retention.d30"], group: "", chart: "line" } }
    ]
  });
</script>
