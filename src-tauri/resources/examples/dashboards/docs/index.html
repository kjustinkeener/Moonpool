<link rel="stylesheet" href="../_lib/theme.css">
<style>
  /* Docs-browser layout (its own page: sidebar + rendered markdown + on-this-page).
     Reuses the shared design tokens from theme.css. */
  .docs-wrap { max-width: 1280px; margin: 0 auto; padding: 24px 24px 56px; }
  .docs-grid {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) 200px;
    gap: 24px; align-items: start;
  }
  @media (max-width: 1080px) { .docs-grid { grid-template-columns: 220px minmax(0, 1fr); } .toc { display: none; } }
  @media (max-width: 760px)  { .docs-grid { grid-template-columns: 1fr; } .side { position: static; } }

  /* Left: doc navigation */
  .side { position: sticky; top: 20px; }
  .side .card { padding: 12px; }
  .search {
    width: 100%; appearance: none; background: var(--elev); color: var(--fg);
    border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 8px 10px; font: inherit; font-size: 13px; margin-bottom: 10px;
  }
  .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: block; padding: 7px 10px; border-radius: var(--r-sm);
    color: var(--fg-muted); text-decoration: none; font-size: 13px; font-weight: 500;
    border-left: 2px solid transparent;
  }
  .nav a:hover { color: var(--fg); background: var(--line-soft); }
  .nav a.active { color: var(--fg); background: var(--accent-soft); border-left-color: var(--accent); }
  .nav a.hidden { display: none; }
  .nav .sect { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-dim); font-weight: 600; padding: 12px 10px 4px; }
  .side .filebtn {
    display: inline-flex; align-items: center; gap: 7px; width: 100%; justify-content: center;
    margin-top: 12px; cursor: pointer; background: var(--elev); color: var(--fg-muted);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px;
    font: inherit; font-size: 13px; font-weight: 550;
  }
  .side .filebtn:hover { border-color: var(--accent); color: var(--fg); }

  /* Middle: rendered markdown */
  .doc-card { padding: 8px 34px 34px; min-height: 60vh; }
  .doc-meta { color: var(--fg-dim); font-size: 12px; padding: 20px 0 0; }
  .md { line-height: 1.65; color: var(--fg); }
  .md > :first-child { margin-top: 8px; }
  .md h1 { font-size: 27px; font-weight: 680; letter-spacing: -0.02em; margin: 10px 0 6px; }
  .md h2 { font-size: 19px; font-weight: 640; margin: 34px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line); letter-spacing: -0.01em; }
  .md h3 { font-size: 15.5px; font-weight: 620; margin: 24px 0 8px; }
  .md h4 { font-size: 13.5px; font-weight: 620; margin: 18px 0 6px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .03em; }
  .md p, .md li { color: #cfd5e2; }
  .md a { color: var(--accent); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md ul, .md ol { padding-left: 22px; }
  .md li { margin: 4px 0; }
  .md li::marker { color: var(--fg-dim); }
  .md strong { color: var(--fg); font-weight: 640; }
  .md code {
    font-family: var(--mono); font-size: 88%; background: #0d1017;
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; color: #b7c0d4;
  }
  .md pre {
    background: #0d1017; border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 14px 16px; overflow: auto; margin: 14px 0;
  }
  .md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; color: #b7c0d4; }
  .md blockquote {
    margin: 14px 0; padding: 4px 16px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0; color: var(--fg-muted);
  }
  .md blockquote p { color: var(--fg-muted); }
  .md table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
  .md th, .md td { padding: 8px 12px; text-align: left; border: 1px solid var(--line); }
  .md th { background: var(--elev); color: var(--fg); font-weight: 620; }
  .md td { color: var(--fg-muted); }
  .md tbody tr:hover td { background: var(--line-soft); }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 26px 0; }
  .md img { max-width: 100%; border-radius: var(--r-sm); }
  .md .anchor { color: var(--fg-dim); text-decoration: none; opacity: 0; margin-left: 8px; font-weight: 400; }
  .md h1:hover .anchor, .md h2:hover .anchor, .md h3:hover .anchor { opacity: 1; }

  /* Right: on-this-page */
  .toc { position: sticky; top: 20px; font-size: 12.5px; }
  .toc .sect { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-dim); font-weight: 600; margin-bottom: 8px; }
  .toc a { display: block; color: var(--fg-muted); text-decoration: none; padding: 4px 0 4px 10px; border-left: 2px solid var(--line); line-height: 1.4; }
  .toc a:hover { color: var(--fg); }
  .toc a.h3 { padding-left: 22px; font-size: 12px; }
  .toc a.active { color: var(--accent); border-left-color: var(--accent); }
  .toc.empty { display: none; }
</style>

<div class="docs-wrap">
  <div class="app-head">
    <div>
      <h1 class="app-title">Moonpool Docs</h1>
      <p class="app-sub">A self-contained, offline docs browser that renders a folder of Markdown. It hosts Moonpool's own help here, and doubles as a template you can point at your own project's <code>.md</code> files.</p>

<script type="text/markdown" data-title="Welcome" data-section="Getting started">
# Welcome to Moonpool

**Moonpool** is a resident system-tray launcher hub for the apps and dev servers on
your machine. Instead of hunting down desktop shortcuts and remembering which
`localhost` port each project uses, you register every app once and Moonpool lists
them all, shows live status, and launches each one inside an **embedded terminal**
so you see its console output as if you had opened the CLI yourself.

## What it does

- **One window, every app.** A grouped, searchable sidebar driven by a single JSON
  manifest (`apps.json`).
- **Launch = run the real command in a PTY.** Clicking an app runs its launch
  command inside a real pseudo-terminal and streams the output to an xterm.js
  terminal tab. Colors, build progress, and errors all show up live, and you can
  type back into it.
- **Live status.** A background poller marks each app running or stopped via a TCP
  port health-check (web apps) or a process-name check (desktop apps), even when you
  started it outside Moonpool.
- **Start / stop / restart** with a busy indicator. Stopping tree-kills the process
  and frees its port. Recently-used apps sort to the top of their group.
- **Stays in the tray.** Closing the window hides it to the tray. Left-click the tray
  icon to reopen, or use the tray menu to quit.

## This docs browser

The page you are reading is itself one of Moonpool's example dashboards: a static,
fully offline Markdown browser. It is wired to render Moonpool's own help, but the
same file will happily render any folder of `.md` docs. Use the **Open a .md file**
button in the sidebar to preview one of your own right now.
</script>

<script type="text/markdown" data-title="Configuring your apps" data-section="Getting started">
# Configuring your apps

Moonpool reads a user-editable manifest from your config directory:

```text
%APPDATA%\Moonpool\apps.json      (Windows)
~/.config/Moonpool/apps.json      (Linux)
```

On first run it is seeded from a bundled example. Use the **&#8943; menu** at the
top-left of the sidebar: **Add app** (a form), **Edit apps.json** (opens the file in
your editor), then **Reload**. No rebuild needed.

## An entry

```jsonc
{
  "id": "myapp",                 // unique slug
  "name": "My App",
  "group": "Web apps",           // any label; groups render in first-seen order
  "type": "web",                 // desktop | web | static | cli
  "cwd": "C:\\path\\to\\app",
  "command": "npm run dev",      // run through cmd /c (sh -c on Linux/macOS)
  "port": 3000,                  // web: status + browser-open
  "url": "http://localhost:3000",
  "openBrowser": true,
  "env": { "PORT": "3000" },     // optional vars injected into the command
  "processName": "myapp",        // desktop: status by process name
  "note": "shown as a tooltip"
}
```

## Type semantics

| `type`    | Status is detected by                          | Clicking it does                     |
| --------- | ---------------------------------------------- | ------------------------------------ |
| `desktop` | `processName` (its executable name)            | launches the app                     |
| `web`     | `port` (TCP health-check)                      | launches, opens the browser when live |
| `static`  | (none)                                         | opens `url`, or runs `command` once  |
| `cli`     | (none)                                         | opens an interactive shell in `cwd`  |

## Command tips

Every `command` runs via `cmd /c` (Windows) or `sh -c` (Linux/macOS) in `cwd`,
inheriting your environment plus any `env`. Prefer a foreground command that streams
logs (`python x.py`, `node server.js`) over a detached launcher. Avoid nested
double-quotes, which get mangled through the shell wrapper.

> **Icons** resolve automatically in most cases: a manifest `icon`, then a PNG in the
> config `icons/` folder, then an icon auto-discovered from the app's own project
> folder, then the desktop executable icon or web favicon, and finally a type glyph.
> Most apps get their real icon with no configuration.
</script>

<script type="text/markdown" data-title="Portable mode" data-section="Guides">
# Portable mode

Moonpool can run as a **portable bundle**: a single movable folder you can drop on a
USB stick or sync between machines. Everything it needs lives inside that folder, and
your normal installed configuration is left untouched.

## The bundle

```text
MyMoonpool/                  <- the movable folder ({MP_HOME})
|- moonpool(.exe)
|- moonpool.portable         <- flag file that switches on portable mode
|- moonpool-config/          <- config + runtime ({MP_DATA})
|  |- apps.json
|  |- settings.json
|  |- webview/               <- webview profile (localStorage travels with the bundle)
|- dashboards/               <- these example dashboards
```

The presence of the `moonpool.portable` flag file next to the executable is what
switches Moonpool into portable mode. When it is set, config and runtime state live
in `moonpool-config/` beside the executable instead of in your user profile.

## Referring to files inside the bundle

So a bundle keeps working after you move it, reference files by a portable token or a
relative path rather than an absolute one:

```jsonc
{ "type": "static", "url": "file:///{MP_HOME}/dashboards/docs/index.html" }
```

`{MP_HOME}` expands to the bundle folder wherever it currently lives, and a `./`
relative path anchors to the same place. The app editor flags absolute, `%VAR%`, and
UNC paths so you can spot anything that will not travel.

## Making one

From the hub's **&#8943; menu**, choose **Create portable copy**:

- **Fresh** stamps a clean portable scaffold plus the example dashboards.
- **Clone current** copies your real `apps.json`, settings, and icons, and rewrites
  any path already inside the bundle to a relative form. Absolute paths that point
  outside the bundle stay flagged so you know they will not move with it.
</script>

<script type="text/markdown" data-title="Command-line control" data-section="Guides">
# Command-line remote control

With Moonpool running, its own executable doubles as a small command-line client that
drives the resident window. A script or an AI agent can start and stop your apps
without touching the GUI.

```bash
Moonpool.exe launch   <app-id>
Moonpool.exe stop     <app-id>
Moonpool.exe restart  <app-id>
Moonpool.exe reload            # re-read apps.json
Moonpool.exe refresh-icons
Moonpool.exe show     <app-id> # bring the window forward on that app
```

## Reading state back

A live `state.json` in the config folder reports what is currently running, so a
caller can poll status. Tag any command with `--ticket <key>` to have its
success or failure written back into `state.json` under that key, which lets an
automated caller confirm the outcome of what it asked for.

> Because a command runs with your full user privileges in a real shell, treat
> `apps.json` like a script you are about to execute: only add entries whose
> `command` and `cwd` you understand and trust. If you let an AI agent populate the
> manifest, review the commands it wrote before launching them.
</script>

<script type="text/markdown" data-title="The example dashboards" data-section="Reference">
# The example dashboards

Moonpool ships a small suite of example dashboards, all static HTML that runs
**offline, with no server and no CDN**. They double as a portfolio of what a
polished local dashboard can look like, and as working templates you can copy.

## Drop your data explorers

Each of these takes a common data file, auto-profiles its shape, and renders an
instant dashboard. Every one ships differently-shaped baked samples and also accepts
your own file, parsed entirely in the browser.

| Explorer | Source format | Parser (vendored inline) |
| -------- | ------------- | ------------------------ |
| CSV      | CSV / TSV     | PapaParse (MIT)          |
| JSON     | JSON          | native                   |
| JSONL    | JSONL / NDJSON| native                   |
| YAML     | YAML          | js-yaml (MIT)            |
| TOML     | TOML          | j-toml (MIT)             |
| Excel    | .xlsx / .xls  | SheetJS (Apache-2.0)     |

They share one design system and one analyzer under `dashboards/_lib/`, so a single
field-mapping strip (X axis, measures, group-by, chart type) reshapes any file. Point
one at your own export and you have a dashboard in a click.

## This docs browser

The page you are reading is the teaching example. It renders a folder of Markdown
with a vendored parser and this shared dark theme, with a searchable sidebar and an
on-this-page outline. Copy the folder, swap in your own `.md` files, and you have an
offline docs site for any project.

## How they are built

- **No build step.** Plain HTML, CSS, and a little ES5-ish JavaScript.
- **Everything vendored.** Charting and parsing libraries are copied into
  `_lib/vendor/` and referenced by relative path, so nothing is fetched at runtime.
- **One shared theme.** `_lib/theme.css` holds the tokens and components; each
  dashboard reuses them so the whole suite reads as one coherent piece.
</script>

<script>
  // ---- collect embedded docs ----
  var docs = [].slice.call(document.querySelectorAll('script[type="text/markdown"]')).map(function (s, i) {
    return {
      id: "d" + i,
      title: s.getAttribute("data-title") || ("Doc " + (i + 1)),
      section: s.getAttribute("data-section") || "Docs",
      md: s.textContent.replace(/^\n/, "")
    };
  });

  marked.setOptions({ gfm: true, breaks: false, headerIds: false, mangle: false });

  var navEl = document.getElementById("nav");
  var contentEl = document.getElementById("content");
  var tocEl = document.getElementById("toc");
  var metaEl = document.getElementById("meta");
  var searchEl = document.getElementById("search");
  var current = null;

  function slug(s) {
    return String(s).toLowerCase().replace(/[^\w]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Strip anything executable from rendered HTML (docs are trusted, but a dropped
  // file might not be): drop <script>/<style> and inline on* handlers.
  function sanitize(html) {
    var box = document.createElement("div");
    box.innerHTML = html;
    box.querySelectorAll("script, style, iframe, object, embed").forEach(function (n) { n.remove(); });
    box.querySelectorAll("*").forEach(function (n) {
      [].slice.call(n.attributes).forEach(function (a) {
        if (/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
      });
    });
    return box;
  }

  function buildNav() {
    navEl.innerHTML = "";
    var sections = [];
    docs.forEach(function (d) { if (sections.indexOf(d.section) < 0) sections.push(d.section); });
    sections.forEach(function (sec) {
      navEl.appendChild(mk("div", "sect", sec));
      docs.filter(function (d) { return d.section === sec; }).forEach(function (d) {
        var a = mk("a", "", d.title);
        a.href = "#" + d.id; a.dataset.id = d.id;
        a.onclick = function (e) { e.preventDefault(); show(d.id); };
        navEl.appendChild(a);
      });
    });
  }

  function mk(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function show(id) {
    var d = docs.filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    current = id;
    var box = sanitize(marked.parse(d.md));

    // anchor ids + hover-links on headings, and gather the on-this-page outline
    var toc = [];
    box.querySelectorAll("h1, h2, h3").forEach(function (h) {
      var sid = slug(h.textContent);
      h.id = sid;
      if (h.tagName !== "H1") {
        toc.push({ level: h.tagName === "H2" ? 2 : 3, text: h.textContent, id: sid });
        var a = mk("a", "anchor", "#"); a.href = "#" + sid;
        a.onclick = function (e) { e.preventDefault(); var t = document.getElementById(sid); if (t) t.scrollIntoView({ behavior: "smooth" }); };
        h.appendChild(a);
      }
    });

    contentEl.innerHTML = "";
    while (box.firstChild) contentEl.appendChild(box.firstChild);
    metaEl.textContent = d.section + (d.source ? "  \u00b7  " + d.source : "");
    buildToc(toc);

    navEl.querySelectorAll("a").forEach(function (a) { a.classList.toggle("active", a.dataset.id === id); });
    window.scrollTo({ top: 0, behavior: "auto" });
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }

  function buildToc(items) {
    if (!items.length) { tocEl.className = "toc empty"; tocEl.innerHTML = ""; return; }
    tocEl.className = "toc"; tocEl.innerHTML = "";
    tocEl.appendChild(mk("div", "sect", "On this page"));
    items.forEach(function (it) {
      var a = mk("a", it.level === 3 ? "h3" : "", it.text);
      a.href = "#" + it.id;
      a.onclick = function (e) { e.preventDefault(); var t = document.getElementById(it.id); if (t) t.scrollIntoView({ behavior: "smooth" }); };
      tocEl.appendChild(a);
    });
  }

  // ---- search: filter the sidebar by title + body text ----
  searchEl.oninput = function () {
    var q = searchEl.value.trim().toLowerCase();
    navEl.querySelectorAll("a").forEach(function (a) {
      var d = docs.filter(function (x) { return x.id === a.dataset.id; })[0];
      var hit = !q || (d && (d.title.toLowerCase().indexOf(q) >= 0 || d.md.toLowerCase().indexOf(q) >= 0));
      a.classList.toggle("hidden", !hit);
    });
    navEl.querySelectorAll(".sect").forEach(function (s) {
      var n = s.nextElementSibling, any = false;
      while (n && !n.classList.contains("sect")) { if (n.tagName === "A" && !n.classList.contains("hidden")) any = true; n = n.nextElementSibling; }
      s.style.display = any ? "" : "none";
    });
  };

  // ---- open a user's own markdown file (bring-your-own) ----
  document.getElementById("file").onchange = function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var d = { id: "user", title: f.name.replace(/\.[^.]+$/, ""), section: "Your file", md: String(r.result), source: f.name };
      var existing = docs.filter(function (x) { return x.id === "user"; })[0];
      if (existing) Object.assign(existing, d); else docs.push(d);
      buildNav(); show("user"); searchEl.value = "";
    };
    r.readAsText(f);
  };

  // ---- go ----
  buildNav();
  var start = (location.hash || "").replace("#", "");
  show(docs.filter(function (d) { return d.id === start; })[0] ? start : docs[0].id);
</script>
</body>
</html>
