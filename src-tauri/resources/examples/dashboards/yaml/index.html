<script>
  function parseYAML(text) { return MP.toRecords(jsyaml.load(text)); }
  function raw(id) { return document.getElementById(id).textContent.trim(); }
  function baked(id) { return parseYAML(raw(id)); }

  MP.createExplorer(document.getElementById("app"), {
    id: "yaml",
    formatName: "YAML",
    title: "YAML Explorer",
    subtitle: "Drop any YAML file (a list of mappings, a mapping containing a list, or a map of maps) and get an instant, auto-profiled dashboard. Nested mappings are flattened automatically. One analyzer, any shape.",
    accept: ".yaml,.yml,.txt",
    parseFile: function (file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () {
          try { resolve(MP.toRecords(jsyaml.load(String(r.result)))); }
          catch (e) { reject(e); }
        };
        r.onerror = function () { reject(r.error); };
        r.readAsText(file);
      });
    },
    tabs: [
      { name: "Sales by rep", rows: baked("s-list"), raw: raw("s-list"), file: "sales-by-rep.yaml",
        mapping: { x: "rep", y: ["closed_won"], group: "region", chart: "bar" } },
      { name: "Tickets by priority", rows: baked("s-map"), raw: raw("s-map"), file: "tickets-by-priority.yaml",
        mapping: { x: "key", y: ["count"], group: "", chart: "pie" } },
      { name: "Pipeline by stage", rows: baked("s-nested"), raw: raw("s-nested"), file: "pipeline.yaml",
        mapping: { x: "stage", y: ["value"], group: "", chart: "bar" } },
      { name: "Team metrics", rows: baked("s-deep"), raw: raw("s-deep"), file: "team-metrics.yaml",
        mapping: { x: "team", y: ["metrics.velocity", "metrics.open_bugs"], group: "", chart: "bar" } }
    ]
  });
</script>
