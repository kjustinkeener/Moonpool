<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Moonpool demo icons</title>
<style>
  body{margin:0;background:#0d1017;color:#c9d1d9;font:14px/1.4 "Segoe UI",system-ui,sans-serif;padding:28px}
  h1{font-size:16px;color:#e6edf3;margin:0 0 4px}
  p{color:#8b949e;margin:0 0 22px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:820px}
  .cell{background:#11151c;border:1px solid #222831;border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px}
  .sizes{display:flex;align-items:center;gap:10px}
  .sizes img{image-rendering:auto}
  .id{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#9aa4b0}
  .row{display:flex;align-items:center;gap:8px;margin-top:2px}
  .swatch16{width:16px;height:16px} /* actual sidebar size */
  .cap{font-size:10px;color:#6b7684;text-align:center;margin-top:3px}
  .sidebar{margin-top:30px;max-width:300px;background:#11151c;border:1px solid #222831;border-radius:10px;padding:8px}
  .sb-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px}
  .sb-row:hover{background:#161b22}
  .dot{width:8px;height:8px;border-radius:50%;background:#39424e}
  .dot.on{background:#61fced;box-shadow:0 0 6px #61fced88}
  .sb-name{font-size:13px;color:#c9d1d9}
</style></head>
<body>
<h1>Moonpool screenshot-demo icons</h1>
<p>Each badge shown at 16px (its real sidebar size), 24px, and 40px. Bottom: a mock sidebar row so you can judge the 16px read on the panel background.</p>
<div class="grid" id="grid"></div>
<div class="sidebar" id="sb"></div>
<script>
  const ids=["notes","pixel-forge","db-inspector","metrics","api-gateway","blog","habit-tracker","handbook","design-system","deploy","backup","log-tail"];
  const names={notes:"Notes","pixel-forge":"Pixel Forge","db-inspector":"DB Inspector",metrics:"Metrics Dashboard","api-gateway":"API Gateway",blog:"Blog","habit-tracker":"Habit Tracker",handbook:"Team Handbook","design-system":"Design System",deploy:"Deploy",backup:"Backup","log-tail":"Log Tailer"};
  const g=document.getElementById('grid');
  for(const id of ids){
    const src="icons/"+id+".svg";
    g.insertAdjacentHTML('beforeend',
      `<div class="cell"><div class="sizes">
         <div><img class="swatch16" src="${src}" width="16" height="16"><div class="cap">16</div></div>
         <div><img src="${src}" width="24" height="24"><div class="cap">24</div></div>
         <div><img src="${src}" width="40" height="40"><div class="cap">40</div></div>
       </div><div class="id">${id}</div></div>`);
  }
  const sb=document.getElementById('sb');
  const on=new Set(["metrics"]);
  for(const id of ids){
    sb.insertAdjacentHTML('beforeend',
      `<div class="sb-row"><span class="dot ${on.has(id)?'on':''}"></span><img class="swatch16" src="icons/${id}.svg" width="16" height="16"><span class="sb-name">${names[id]}</span></div>`);
  }
</script>
</body></html>
