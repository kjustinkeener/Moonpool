<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrics Dashboard</title>
<style>
  :root{
    --bg:#0d1017; --panel:#11151c; --border:#222831; --text:#c9d1d9;
    --strong:#e6edf3; --muted:#8b949e; --accent:#388bfd; --green:#3fb950;
    --teal:#61fced; --amber:#f2a541; --pink:#ec6cb9;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:960px;margin:0 auto;padding:32px 24px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  header h1{font-size:20px;margin:0;color:var(--strong)}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
  .card .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .card .v{font-size:26px;font-weight:650;color:var(--strong);margin-top:6px}
  .card .d{font-size:12px;margin-top:4px}
  .up{color:var(--green)} .down{color:#f85149}
  .chart{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}
  .chart h2{font-size:13px;margin:0 0 14px;color:var(--strong);font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px}
  .bar{flex:1;background:linear-gradient(180deg,var(--accent),#1f6feb);border-radius:5px 5px 0 0;position:relative}
  .bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="26" height="26" viewBox="0 0 24 24"><rect width="24" height="24" rx="5.5" fill="#388bfd"/><g fill="#fff"><rect x="5" y="13" width="3.3" height="6" rx="1"/><rect x="10.35" y="9" width="3.3" height="10" rx="1"/><rect x="15.7" y="5.5" width="3.3" height="13.5" rx="1"/></g></svg>
    <h1>Metrics Dashboard</h1>
    <div class="live">live &middot; :5173</div>
  </header>
  <div class="cards">
    <div class="card"><div class="k">Requests</div><div class="v">48.2k</div><div class="d up">&#9650; 12.4%</div></div>
    <div class="card"><div class="k">p95 Latency</div><div class="v">86ms</div><div class="d up">&#9660; 7.1%</div></div>
    <div class="card"><div class="k">Error rate</div><div class="v">0.34%</div><div class="d down">&#9650; 0.1%</div></div>
    <div class="card"><div class="k">Uptime</div><div class="v">99.98%</div><div class="d up">30d</div></div>
  </div>
  <div class="chart">
    <h2>Requests per hour</h2>
    <div class="bars">
      <div class="bar" style="height:42%"><span>09</span></div>
      <div class="bar" style="height:58%"><span>10</span></div>
      <div class="bar" style="height:71%"><span>11</span></div>
      <div class="bar" style="height:64%"><span>12</span></div>
      <div class="bar" style="height:88%"><span>13</span></div>
      <div class="bar" style="height:97%"><span>14</span></div>
      <div class="bar" style="height:79%"><span>15</span></div>
      <div class="bar" style="height:69%"><span>16</span></div>
    </div>
  </div>
</div>
</body>
</html>
